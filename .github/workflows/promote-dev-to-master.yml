name: Promote dev to master

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de version à publier"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: promote-dev-to-master
  cancel-in-progress: false

jobs:
  promote:
    name: Validate, bump and promote dev to master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Validate module.json
        shell: bash
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('module.json','utf8')); if(m.id!=='light-fishing-minigame'||!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('module.json invalide');"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check scripts/main.js
          node --check scripts/fish-data.js

      - name: Validate game data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ZONES, POISSONS, BOSS_PAR_ZONE } from './scripts/fish-data.js';
          const ids = new Set(POISSONS.map(f => f.id));
          if (ZONES.length !== 18) throw new Error(\`18 zones attendues, reçu: \${ZONES.length}\`);
          if (POISSONS.length !== 144) throw new Error(\`144 poissons attendus, reçu: \${POISSONS.length}\`);
          if (ids.size !== POISSONS.length) throw new Error('IDs de poissons dupliqués');
          for (const zone of ZONES) if (!BOSS_PAR_ZONE.get(zone.id)) throw new Error(\`Boss manquant: \${zone.id}\`);
          NODE

      - name: Require fast-forward promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master dev
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::master a divergé de dev. Promotion refusée pour éviter d'écraser des commits."
            exit 1
          fi

      - name: Bump Foundry module version
        id: version
        shell: bash
        env:
          BUMP: \${{ inputs.bump }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");

          const file = "module.json";
          const m = JSON.parse(fs.readFileSync(file, "utf8"));
          const oldVersion = m.version;
          if (!/^\d+\.\d+\.\d+$/.test(oldVersion ?? "")) {
            throw new Error("Version SemVer invalide: " + oldVersion);
          }

          let [major, minor, patch] = oldVersion.split(".").map(Number);
          switch (process.env.BUMP) {
            case "patch": patch += 1; break;
            case "minor": minor += 1; patch = 0; break;
            case "major": major += 1; minor = 0; patch = 0; break;
            default: throw new Error("Type de bump invalide: " + process.env.BUMP);
          }

          const nextVersion = [major, minor, patch].join(".");
          const repo = process.env.GITHUB_REPOSITORY;
          const repoName = repo.split("/")[1];

          m.version = nextVersion;
          m.download = \`https://github.com/\${repo}/releases/download/v\${nextVersion}/\${repoName}-v\${nextVersion}.zip\`;

          if (typeof m.changelog === "string" && m.changelog.includes("/releases/tag/")) {
            m.changelog = \`https://github.com/\${repo}/releases/tag/v\${nextVersion}\`;
          }

          if (typeof m.description === "string" && m.description.includes(\`v\${oldVersion}\`)) {
            m.description = m.description.replace(\`v\${oldVersion}\`, \`v\${nextVersion}\`);
          }

          fs.writeFileSync(file, JSON.stringify(m, null, 2) + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, \`old=\${oldVersion}\nversion=\${nextVersion}\n\`);
          console.log(\`Version: v\${oldVersion} -> v\${nextVersion}\`);
          NODE

      - name: Validate generated release metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="\${{ steps.version.outputs.version }}"
          REPO_NAME="\${GITHUB_REPOSITORY#*/}"
          EXPECTED_DOWNLOAD="https://github.com/\${GITHUB_REPOSITORY}/releases/download/v\${VERSION}/\${REPO_NAME}-v\${VERSION}.zip"
          EXPECTED_MANIFEST="https://github.com/\${GITHUB_REPOSITORY}/releases/latest/download/module.json"
          ACTUAL_DOWNLOAD=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).download || ''")
          ACTUAL_MANIFEST=$(node -p "JSON.parse(require('fs').readFileSync('module.json','utf8')).manifest || ''")

          test "$ACTUAL_DOWNLOAD" = "$EXPECTED_DOWNLOAD" || { echo "::error::URL download incorrect"; exit 1; }
          test "$ACTUAL_MANIFEST" = "$EXPECTED_MANIFEST" || { echo "::error::URL manifest incorrect"; exit 1; }

      - name: Commit version bump on dev
        shell: bash
        run: |
          set -euo pipefail
          VERSION="\${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json
          git commit -m "chore(release): bump version to v\${VERSION}"
          git push origin HEAD:dev

      - name: Promote dev to master
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master
