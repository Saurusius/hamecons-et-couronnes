name: Promote dev to master

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-dev-to-master
  cancel-in-progress: false

jobs:
  validate:
    name: Validate module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate module.json
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('module.json','utf8')); if(!m.id||!m.version) throw new Error('module.json invalide'); console.log(m.id, m.version);"

      - name: Check JavaScript syntax
        run: |
          node --check scripts/main.js
          node --check scripts/fish-data.js

      - name: Validate game data
        run: |
          node --input-type=module <<'NODE'
          import { ZONES, POISSONS, BOSS_PAR_ZONE } from './scripts/fish-data.js';
          const ids = new Set(POISSONS.map(f => f.id));
          if (ZONES.length !== 18) throw new Error(`18 zones attendues, reçu: ${ZONES.length}`);
          if (POISSONS.length !== 144) throw new Error(`144 poissons attendus, reçu: ${POISSONS.length}`);
          if (ids.size !== POISSONS.length) throw new Error('IDs de poissons dupliqués');
          for (const zone of ZONES) if (!BOSS_PAR_ZONE.get(zone.id)) throw new Error(`Boss manquant: ${zone.id}`);
          console.log('Données validées.');
          NODE

  promote:
    name: Fast-forward dev to master
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Promote only if master is an ancestor of dev
        run: |
          git fetch origin dev master
          git merge-base --is-ancestor origin/master origin/dev || {
            echo "::error::master a divergé de dev. Fusion automatique refusée.";
            exit 1;
          }
          git push origin origin/dev:refs/heads/master
